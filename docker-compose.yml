x-api: &api
  build: ./backend
  env_file:
    - ./backend/.env
  expose:
    - "5000"
  restart: unless-stopped

services:
  api1:
    <<: *api

  api2:
    <<: *api

  api3:
    <<: *api

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
    restart: unless-stopped