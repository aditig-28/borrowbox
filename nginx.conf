
events {}

http {
    log_format upstream_log
        '$time_iso8601 status=$status upstream=$upstream_addr '
        'upstream_status=$upstream_status request="$request"';

    access_log /var/log/nginx/access.log upstream_log;

    upstream borrowbox_api {
        least_conn;

        server api1:5000 max_fails=1 fail_timeout=2s;
        server api2:5000 max_fails=1 fail_timeout=2s;
        server api3:5000 max_fails=1 fail_timeout=2s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://borrowbox_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;

            add_header X-Upstream $upstream_addr always;
        }
    }
}
